name: Patch check

# esp32/main must be exactly `upstream` (EVerest main) plus the patches in patches/.
on:
  pull_request:
    branches: [esp32/main]
  push:
    branches: [esp32/main]
  workflow_dispatch: # sync.yml starts it for the sync branch

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: git fetch --no-tags origin upstream:upstream
      - run: .github/sync/patches.sh verify upstream HEAD
